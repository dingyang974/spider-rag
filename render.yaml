services:
  - type: web
    name: spider-rag-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-3.5-turbo
      - key: DATA_PATH
        value: ./data/comments.csv
      - key: VECTOR_STORE_PATH
        value: ./vector_store
      - key: LOG_PATH
        value: ./logs
